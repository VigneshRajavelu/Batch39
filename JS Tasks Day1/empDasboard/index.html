<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <header>
            <h1>EMPLOYEE MANAGEMENT SYSTEM</h1>

            <div class="datetime">
                <span id="today"></span>
                <span id="currentTime"></span>
            </div>
        </header>


        <!-- SEARCH -->
        <section class="search-section">

            <label for="searchInput">Search Employee:</label>

            <input
                type="text"
                id="searchInput"
                placeholder="Enter employee name..."
            >

            <button id="searchBtn">Search</button>

        </section>


        <!-- DEPARTMENT FILTER -->
        <section class="filter-section">

            <button class="department-btn active" data-department="All">
                All
            </button>

            <button class="department-btn" data-department="IT">
                IT
            </button>

            <button class="department-btn" data-department="HR">
                HR
            </button>

            <button class="department-btn" data-department="Finance">
                Finance
            </button>

            <button class="department-btn" data-department="Marketing">
                Marketing
            </button>

        </section>


        <!-- STATUS -->
        <div id="statusMessage" class="status-message">
            Loading employees...
        </div>


        <!-- STATISTICS -->
        <section class="statistics">

            <div class="stat-card">
                <h3>Total Employees</h3>
                <p id="employeeCount">0</p>
            </div>

            <div class="stat-card">
                <h3>Total Salary</h3>
                <p id="totalSalary">₹0</p>
            </div>

            <div class="stat-card">
                <h3>Average Salary</h3>
                <p id="averageSalary">₹0</p>
            </div>

            <div class="stat-card">
                <h3>Highest Salary</h3>
                <p id="highestSalary">₹0</p>
            </div>

        </section>


        <!-- SORT -->
        <section class="sort-section">

            <label for="sortSelect">Sort Employees:</label>

            <select id="sortSelect">

                <option value="none">
                    Default
                </option>

                <option value="nameAsc">
                    Name ↑
                </option>

                <option value="nameDesc">
                    Name ↓
                </option>

                <option value="ageAsc">
                    Age ↑
                </option>

                <option value="ageDesc">
                    Age ↓
                </option>

                <option value="salaryAsc">
                    Salary ↑
                </option>

                <option value="salaryDesc">
                    Salary ↓
                </option>

            </select>

        </section>


        <!-- EMPLOYEE LIST -->
        <section>

            <h2>Employees</h2>

            <div id="employeeContainer" class="employee-container">
                <!-- Employee cards will be created here -->
            </div>

        </section>


        <!-- ADD EMPLOYEE -->
        <section class="add-employee">

            <h2>ADD EMPLOYEE</h2>

            <form id="employeeForm">

                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter employee name"
                    >

                    <small id="nameError" class="error"></small>

                </div>


                <div class="form-group">

                    <label for="age">
                        Age
                    </label>

                    <input
                        type="number"
                        id="age"
                        placeholder="Enter age"
                    >

                    <small id="ageError" class="error"></small>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email"
                    >

                    <small id="emailError" class="error"></small>

                </div>


                <div class="form-group">

                    <label for="department">
                        Department
                    </label>

                    <select id="department">

                        <option value="">
                            Select Department
                        </option>

                        <option value="IT">
                            IT
                        </option>

                        <option value="HR">
                            HR
                        </option>

                        <option value="Finance">
                            Finance
                        </option>

                        <option value="Marketing">
                            Marketing
                        </option>

                    </select>

                    <small id="departmentError" class="error"></small>

                </div>


                <div class="form-group">

                    <label for="salary">
                        Salary
                    </label>

                    <input
                        type="number"
                        id="salary"
                        placeholder="Enter salary"
                    >

                    <small id="salaryError" class="error"></small>

                </div>


                <button type="submit">
                    Add Employee
                </button>

            </form>

        </section>

    </div>


    <script src="script.js"></script>

</body>
</html>
